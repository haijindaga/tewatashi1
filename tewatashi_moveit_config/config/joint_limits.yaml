# joint_limits.yaml overwrites / augments the limits from the URDF for MoveIt.
#
# Scaling factors: same values as the official UR tutorial and the MoveIt
# default since Noetic (10 % of the maximum). Requests can ask for more
# (<= 1.0) explicitly.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

# Acceleration limits: 5.0 rad/s^2, same as ur_moveit_config and the tutorial
# (UR does not publish acceleration limits; MoveIt needs them).
# Position limits: narrowed to +-180 deg, identical to
# tewatashi_control/config/ur7e/joint_limits.yaml (keep both in sync).
joint_limits:
  shoulder_pan_joint:
    has_position_limits: true
    min_position: -3.14159
    max_position: 3.14159
    has_acceleration_limits: true
    max_acceleration: 5.0
  shoulder_lift_joint:
    has_position_limits: true
    min_position: -3.14159
    max_position: 3.14159
    has_acceleration_limits: true
    max_acceleration: 5.0
  elbow_joint:
    has_position_limits: true
    min_position: -3.14159
    max_position: 3.14159
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_1_joint:
    has_position_limits: true
    min_position: -3.14159
    max_position: 3.14159
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_2_joint:
    has_position_limits: true
    min_position: -3.14159
    max_position: 3.14159
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_3_joint:
    has_position_limits: true
    min_position: -3.14159
    max_position: 3.14159
    has_acceleration_limits: true
    max_acceleration: 5.0
